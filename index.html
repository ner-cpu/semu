<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>법인등록번호 조회</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
    background: #f4f6fa; color: #222;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: #667; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  select, input, button {
    font-size: 15px; padding: 11px 14px; border-radius: 8px; border: 1px solid #d0d5de;
  }
  input { flex: 1; min-width: 200px; }
  button {
    background: #2f5bea; color: #fff; border: none; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2448c4; }
  button.small {
    padding: 5px 10px; font-size: 12px; background: #eef2ff; color: #2f5bea;
  }
  #status { margin: 16px 0 8px; font-size: 14px; color: #556; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 10px; border-bottom: 1px solid #eceff4; text-align: left; }
  th { background: #fafbfd; color: #556; font-weight: 600; }
  tr:hover td { background: #fafcff; }
  .crno { font-family: monospace; font-weight: 700; letter-spacing: .5px; }
  .pager { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .pager button { background: #fff; color: #333; border: 1px solid #d0d5de; padding: 6px 12px; }
  .pager button.active { background: #2f5bea; color: #fff; border-color: #2f5bea; }
  .error { color: #d33; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏢 법인등록번호 조회</h1>
  <div class="sub">금융위원회 기업기본정보 API 기반 · 법인명으로 법인등록번호를 찾아보세요.</div>

  <div class="card">
    <form id="form">
      <select id="type">
        <option value="corpNm">법인명</option>
        <option value="crno">법인등록번호</option>
      </select>
      <input id="keyword" placeholder="예) 메리츠자산운용" autofocus />
      <button type="submit">조회</button>
    </form>

    <div id="status"></div>
    <div class="table-wrap">
      <table id="table" hidden>
        <thead>
          <tr>
            <th>법인명</th>
            <th>법인등록번호</th>
            <th>사업자등록번호</th>
            <th>대표자</th>
            <th>영문명</th>
            <th>주소</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ROWS = 10;
let current = { type: 'corpNm', keyword: '' };

$('type').addEventListener('change', () => {
  $('keyword').placeholder =
    $('type').value === 'corpNm' ? '예) 메리츠자산운용' : '예) 1101113892240';
});

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  current = { type: $('type').value, keyword: $('keyword').value.trim() };
  search(1);
});

async function search(page) {
  if (!current.keyword) return;
  $('status').className = '';
  $('status').textContent = '조회 중...';
  $('table').hidden = true;
  $('pager').innerHTML = '';

  const qs = new URLSearchParams({ [current.type]: current.keyword, pageNo: page, numOfRows: ROWS });

  try {
    const r = await fetch('/api/search?' + qs);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '오류가 발생했습니다.');

    if (!data.items.length || !data.items[0] || !data.items[0].crno) {
      $('status').textContent = '검색 결과가 없습니다.';
      return;
    }
    $('status').textContent = `총 ${data.totalCount.toLocaleString()}건`;
    render(data.items);
    renderPager(data.totalCount, page);
  } catch (err) {
    $('status').className = 'error';
    $('status').textContent = err.message;
  }
}

function esc(s) {
  return String(s ?? '-').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function fmtBzno(b) {
  if (!b || b.length !== 10) return esc(b);
  return `${b.slice(0,3)}-${b.slice(3,5)}-${b.slice(5)}`;
}
function fmtCrno(c) {
  if (!c || c.length !== 13) return esc(c);
  return `${c.slice(0,6)}-${c.slice(6)}`;
}

function render(items) {
  $('tbody').innerHTML = items.map((it) => `
    <tr>
      <td>${esc(it.corpNm)}</td>
      <td>
        <span class="crno">${fmtCrno(it.crno)}</span>
        <button class="small" onclick="copy('${esc(it.crno)}', this)">복사</button>
      </td>
      <td>${fmtBzno(it.bzno)}</td>
      <td>${esc(it.enpRprFnm)}</td>
      <td>${esc(it.corpEnsnNm)}</td>
      <td>${esc(it.enpBsadr)}</td>
    </tr>`).join('');
  $('table').hidden = false;
}

function renderPager(total, page) {
  const last = Math.ceil(total / ROWS);
  if (last <= 1) return;
  const start = Math.max(1, page - 2);
  const end = Math.min(last, start + 4);
  let html = '';
  if (page > 1) html += `<button onclick="search(${page - 1})">‹</button>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="search(${i})">${i}</button>`;
  }
  if (page < last) html += `<button onclick="search(${page + 1})">›</button>`;
  $('pager').innerHTML = html;
}

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(() => (btn.textContent = old), 1200);
  });
}
</script>
</body>
</html>
